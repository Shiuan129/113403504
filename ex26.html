<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>CSS Image Styling</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            gap: 20px;
        }

        .left {
            width: 33%;
            height: 300px;
            border-radius: 18px;
            object-fit: cover;
        }

        .middle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 1px solid #000;
            object-fit: cover;
            flex-shrink: 0;
        }

        .right {
            width: 33%;
            height: 300px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="你的照片檔名.jpg" class="left">
        <img src="你的另一張照片檔名.jpg" class="middle">
        <img src="你的照片檔名.jpg" class="right">
    </div>

</body>
</html>
