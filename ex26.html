<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>CSS Image Practice</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .img-left {
            width: 33%;
            height: 300px;
            border-radius: 18px;
            object-fit: cover;
        }

        .img-middle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 1px solid #000;
            object-fit: cover;
            flex-shrink: 0;
        }

        .img-right {
            width: 33%;
            height: 300px;
        }
    </style>
</head>
<body>

    <img src="pic1.jpg" class="img-left">
    <img src="pic2.jpg" class="img-middle">
    <img src="pic1.jpg" class="img-right">

</body>
</html>
