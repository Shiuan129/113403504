<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Circle Calculator</title>
</head>
<body>

    <h1>請打開瀏覽器主控台 (Console) 查看計算結果</h1>
    <p>快捷鍵提示：</p>
    <ul>
        <li>Windows / Linux：按 <strong>F12</strong> 或 <strong>Ctrl + Shift + I</strong>，並切換到 Console 標籤頁。</li>
        <li>Mac：按 <strong>Cmd + Option + I</strong>，並切換到 Console 標籤頁。</li>
    </ul>

    <script>
        function calcCircumfrence(radius) {
            let circumference = 2 * Math.PI * radius;
            console.log("The circumference is " + circumference);
        }

        function calcArea(radius) {
            let area = Math.PI * Math.pow(radius, 2);
            console.log("The area is " + area);
        }

        calcCircumfrence(5);
        calcArea(5);
    </script>

</body>
</html>
