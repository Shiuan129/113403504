<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: "Roboto", sans-serif; }
  .container { width: 496px; border: 1px solid #ccc; position: relative; background: #fff; }
  .header { height: 35px; padding: 0 22px 0 20px; display: flex; align-items: center; justify-content: space-between; }
  .label { font-size: 13px; color: #707070; }
  .btn {
    height: 22px; border-radius: 8px; background: #fff; border: 1px solid #2f2f2f;
    padding: 0 18px; color: #2f2f2f; font-size: 13px; cursor: pointer;
    display: flex; align-items: center;
  }
  .preview-area { padding: 0 23px 26px 23px; display: flex; justify-content: center; }
  .preview-img { width: 450px; height: 240px; background: #999; display: block; object-fit: cover; }
  .info { display: none; padding: 0 20px 20px; font-size: 13px; }
  .line { background: #b2f2bb; margin-bottom: 2px; color: #2f2f2f; padding: 2px 5px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="label">預覽</div>
    <button class="btn" onclick="toggle()">查看資訊</button>
  </div>
  <div class="preview-area">
    <img src="https://via.placeholder.com/450x240" class="preview-img">
  </div>
  <div id="box" class="info">
    <div class="line">修改日期：</div>
    <div class="line">類別：</div>
    <div class="line">大小：</div>
    <div class="line">路徑：</div>
  </div>
</div>
<script>
  function toggle() {
    const b = document.getElementById('box');
    const t = document.querySelector('.btn');
    const isShow = b.style.display === 'block';
    b.style.display = isShow ? 'none' : 'block';
    t.innerHTML = isShow ? '查看資訊' : '收起資訊';
  }
</script>
</body>
</html>
