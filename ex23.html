<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: "Roboto", sans-serif; }
  .container { width: 496px; border: 1px solid #ccc; position: relative; }
  .preview { width: 450px; height: 240px; background: #eee; margin: 20px auto; display: block; }
  .btn {
    height: 22px; border-radius: 8px; background: #fff; border: 1px solid #2f2f2f;
    padding: 0 18px; color: #2f2f2f; font-size: 13px; cursor: pointer;
    position: absolute; top: 18px; right: 22px; display: flex; align-items: center;
  }
  .info { display: none; padding: 10px 20px; font-size: 13px; }
  .line { background: #b2f2bb; margin-bottom: 2px; color: #2f2f2f; padding: 2px 5px; }
</style>
</head>
<body>
<div class="container">
  <button class="btn" onclick="toggle()">查看資訊</button>
  <div class="preview"></div>
  <div id="box" class="info">
    <div class="line">修改日期：2017/10/12</div>
    <div class="line">類別：JPG</div>
    <div class="line">大小：466.97KB</div>
    <div class="line">路徑：\\designcenter.qnap.com.tw...</div>
  </div>
</div>
<script>
  function toggle() {
    const b = document.getElementById('box');
    const t = document.querySelector('.btn');
    const isShow = b.style.display === 'block';
    b.style.display = isShow ? 'none' : 'block';
    t.innerHTML = isShow ? '查看資訊' : '收起資訊';
  }
</script>
</body>
</html>
