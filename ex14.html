<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        .container {
            position: relative;
            height: 200px;
        }

        .rectangle {
            width: 150px;
            height: 150px;
            background-color: blue;
            border: 3px solid black;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .circle {
            width: 120px;
            height: 120px;
            background-color: yellow;
            border: 5px solid red;
            border-radius: 50%;
            position: absolute;
            top: 40px;
            left: 100px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="rectangle"></div>
        <div class="circle"></div>
    </div>

</body>
</html>
