<!DOCTYPE html>
<html>
<head>
    <style>
        div{
            font-family:serif;
            font-weight:bold;
            font-size:32px;
            padding:10px;
            margin-bottom:20px;
            width:100vw;
        }
        .box1{
            background-color:lightblue;
            border:5px double coral;
        }
        .box2{
            background-color:yellow;
            border:2px solid dodgerblue;
            border-radius:15px;
        }
        .box3{
            background-color:mediumseagreen;
            border:8px dotted gray;
        }
    </style>
</head>
<body>
    <div class="box1">Hello World                    </div>
    <div class="box2">Hello World                    </div>
    <div class="box3">Hello World                    </div>
</body>
</html>
